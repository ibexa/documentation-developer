theme:
    name: material
    features:
        - content.code.annotate
        - content.code.copy
        - navigation.tracking
        - navigation.top
        - content.tabs.link
    custom_dir: 'theme'
    favicon: 'images/favicon.png'
    language: 'en'
    palette:
        primary: 'blue grey'
        accent: 'deep orange'
    logo: 'images/cohesivo-logo.svg'

extra:
  append_bootstrap:
    - '/guidelines/components/'
    - '/guidelines/resources/'
    - '/index.md'
  related_docs:
    - title: 'Cohesivo Developer Documentation'
      url: '/'
    - title: 'User Documentation'
      url: '/projects/userguide'
    - title: 'Connect Documentation'
      url: '/projects/connect'

    # Global variables
  site_display_name: 'Cohesivo Documentation'
  product_name_base: 'Ibexa'
  product_name: 'Cohesivo'
  product_name_headless: 'Ibexa Headless'
  product_name_exp: 'Ibexa Experience'
  product_name_com: 'Ibexa Commerce'
  product_name_cloud: 'Ibexa Cloud'
  product_name_cdp: 'Raptor CDP'
  product_name_cdp_base: 'Raptor'
  product_name_connect: 'Ibexa Connect'
  product_name_engage: 'Qualifio'
  pim_product_name: 'Quable'
  ai_product_name: 'Ibexa Agentic Marketing Platform'

  eol_versions: ['2.5', '3.3']

  # Global variables - latest tag versions
  latest_tag_2_5: '2.5.32'
  latest_tag_3_3: '3.3.43'
  latest_tag_4_0: '4.0.8'
  latest_tag_4_1: '4.1.5'
  latest_tag_4_2: '4.2.4'
  latest_tag_4_3: '4.3.5'
  latest_tag_4_4: '4.4.4'
  latest_tag_4_5: '4.5.7'
  latest_tag_4_6: '4.6.32'
  latest_tag_5_0: '5.0.10'
  latest_tag_6_0: '6.0.0'

  symfony_version: '7.4' 
  symfony_doc: 'https://symfony.com/doc/7.4'
  user_doc: 'https://doc.ibexa.co/projects/userguide/en/saas'
  on_premise_doc: 'https://doc.ibexa.co/en/latest'
  connect_doc: 'https://doc.ibexa.co/projects/connect/en/latest'

extra_css:
