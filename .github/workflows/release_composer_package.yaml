name: "Release Composer package"

on:
    workflow_dispatch:
        inputs:
            version:
                # The DXP version this doc release should match (e.g. v5.0.9 or 5.0.9).
                # The branch to build from is derived from it (5.0.9 -> 5.0).
                description: 'Version (e.g. v5.0.9 or 5.0.9)'
                required: true
                type: string

jobs:
    release:
        runs-on: ubuntu-latest
        permissions:
            # Needed to commit the generated Markdown and push a tag.
            contents: write

        steps:
            - name: Set version and branch
              id: version_and_branch
              run: |
                  # Strip leading 'v' to get a plain version number (e.g. 5.0.9)
                  version="${{ inputs.version }}"
                  version="${version#v}"
                  base_branch="$(echo $version | sed 's/\(.*\..*\)\..*/\1/')"

                  echo "version=${version}" >> "$GITHUB_OUTPUT"
                  echo "base_branch=${base_branch}" >> "$GITHUB_OUTPUT"

            - uses: actions/checkout@v4
              with:
                  ref: ${{ steps.version_and_branch.outputs.base_branch }}
                  # Full history + tags, so we can tell whether this version was already tagged.
                  fetch-depth: 0

            - name: Check tag doesn't already exist
              env:
                  VERSION: ${{ steps.version_and_branch.outputs.version }}
              run: |
                  if git rev-parse "$VERSION" >/dev/null 2>&1; then
                      echo "::error::Tag $VERSION already exists — refusing to overwrite it."
                      exit 1
                  fi

            - name: Set up Python
              uses: actions/setup-python@v3
              with:
                  python-version: "3.13"

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -r requirements.txt

            - name: Build documentation
              run: mkdocs build --strict

            - name: Sync generated Markdown into tracked directory
              run: |
                  rsync -a --delete --include='*/' --include='*.md' --exclude='*' site/ doc/
                  cp site/llms.txt llms.txt
                  cp site/llms-full.txt llms-full.txt

            - name: Check for changes
              id: changes
              run: |
                  git add doc llms.txt llms-full.txt
                  if git diff --cached --quiet; then
                      echo "changed=false" >> "$GITHUB_OUTPUT"
                  else
                      echo "changed=true" >> "$GITHUB_OUTPUT"
                  fi

            - name: Commit generated Markdown
              if: steps.changes.outputs.changed == 'true'
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git commit -m "Update generated Markdown docs for ${{ steps.version_and_branch.outputs.version }}"

            - name: Tag release
              env:
                  VERSION: ${{ steps.version_and_branch.outputs.version }}
                  BASE_BRANCH: ${{ steps.version_and_branch.outputs.base_branch }}
              run: |
                  # The tag matches the DXP product version exactly (e.g. 5.0.9) — no derived or
                  # date-based suffix — so the doc package version always lines up 1:1 with the
                  # ibexa/* package versions it documents.
                  git tag "$VERSION"
                  if [[ "${{ steps.changes.outputs.changed }}" == "true" ]]; then
                      git push origin "$BASE_BRANCH" "$VERSION"
                  else
                      git push origin "$VERSION"
                  fi
