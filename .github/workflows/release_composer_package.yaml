name: "Release Composer package"

on:
    schedule:
        # Daily at 03:17 UTC. Fans out to every maintained version branch (see determine-branches).
        - cron: "17 3 * * *"
    workflow_dispatch: ~

jobs:
    determine-branches:
        runs-on: ubuntu-latest
        outputs:
            branches: ${{ steps.set.outputs.branches }}
        steps:
            - id: set
              run: |
                  if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
                      # Manual runs only release the branch the workflow was dispatched from.
                      branches='["${{ github.ref_name }}"]'
                  else
                      # Scheduled runs always execute in the default branch's context, so they must
                      # explicitly check out each maintained version branch instead of relying on
                      # GITHUB_REF. Extend this list as new branches become active / drop EOL ones.
                      branches='["5.0"]'
                  fi
                  echo "branches=${branches}" >> "$GITHUB_OUTPUT"

    release:
        needs: determine-branches
        runs-on: ubuntu-latest
        permissions:
            # Needed to commit the generated Markdown and push a tag.
            contents: write
        strategy:
            fail-fast: false
            matrix:
                branch: ${{ fromJson(needs.determine-branches.outputs.branches) }}

        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ matrix.branch }}
                  # Full history + tags: the generated Markdown is never pushed to the branch
                  # itself (see below), only tagged, so tags are the only place to diff against.
                  fetch-depth: 0
                  fetch-tags: true

            - name: Set up Python
              uses: actions/setup-python@v3
              with:
                  python-version: "3.13"

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -r requirements.txt

            - name: Determine base version from mkdocs.yml
              id: base_version
              run: |
                  key="latest_tag_$(echo '${{ matrix.branch }}' | tr '.' '_')"
                  base_version=$(python3 -c "import yaml; print(yaml.safe_load(open('mkdocs.yml'))['extra']['$key'])")
                  echo "base_version=${base_version}" >> "$GITHUB_OUTPUT"

            - name: Build documentation
              run: mkdocs build --strict

            - name: Sync generated Markdown into tracked directory
              run: |
                  rsync -a --delete --include='*/' --include='*.md' --exclude='*' site/ doc/
                  cp site/llms.txt llms.txt
                  cp site/llms-full.txt llms-full.txt

            - name: Find the last tag for this branch
              id: last_tag
              env:
                  BRANCH: ${{ matrix.branch }}
              run: |
                  latest_tag=$(git tag --list "${BRANCH}.*" | sort -t. -k1,1n -k2,2n -k3,3n -k4,4n | tail -1)
                  echo "latest_tag=${latest_tag}" >> "$GITHUB_OUTPUT"

            - name: Check for content changes since the last tag
              id: changes
              env:
                  LATEST_TAG: ${{ steps.last_tag.outputs.latest_tag }}
              run: |
                  # The generated Markdown is never committed/pushed to the branch itself (only
                  # tagged), so there's nothing on the branch to diff against — compare the freshly
                  # built content to what the last tag captured instead.
                  git add doc llms.txt llms-full.txt
                  if [[ -z "$LATEST_TAG" ]]; then
                      echo "changed=true" >> "$GITHUB_OUTPUT"
                  elif git diff --cached --quiet "$LATEST_TAG" -- doc llms.txt llms-full.txt; then
                      echo "changed=false" >> "$GITHUB_OUTPUT"
                  else
                      echo "changed=true" >> "$GITHUB_OUTPUT"
                  fi

            - name: Commit generated Markdown
              if: steps.changes.outputs.changed == 'true'
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git commit -m "Update generated Markdown docs for ${{ steps.base_version.outputs.base_version }}"

            - name: Tag release
              if: steps.changes.outputs.changed == 'true'
              env:
                  BASE_VERSION: ${{ steps.base_version.outputs.base_version }}
              run: |
                  # Push only the tag, never the branch — the branch stays exactly as authored,
                  # the generated Markdown exists solely as the commit this tag points to.
                  tag="${BASE_VERSION}.$(date -u +%Y%m%d)"

                  if git rev-parse "$tag" >/dev/null 2>&1; then
                      echo "Tag $tag already exists, skipping."
                      exit 0
                  fi

                  git tag "$tag"
                  git push origin "$tag"
