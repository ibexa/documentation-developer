name: "Release Composer package"

on:
    schedule:
        # Daily at 03:17 UTC. Fans out to every maintained version branch (see determine-branches).
        - cron: "17 3 * * *"
    workflow_dispatch: ~

jobs:
    determine-branches:
        runs-on: ubuntu-latest
        outputs:
            branches: ${{ steps.set.outputs.branches }}
        steps:
            - id: set
              run: |
                  if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
                      # Manual runs only release the branch the workflow was dispatched from.
                      branches='["${{ github.ref_name }}"]'
                  else
                      # Scheduled runs always execute in the default branch's context, so they must
                      # explicitly check out each maintained version branch instead of relying on
                      # GITHUB_REF. Extend this list as new branches become active / drop EOL ones.
                      branches='["5.0"]'
                  fi
                  echo "branches=${branches}" >> "$GITHUB_OUTPUT"

    release:
        needs: determine-branches
        runs-on: ubuntu-latest
        permissions:
            # Needed to commit the generated Markdown and push a tag.
            contents: write
        strategy:
            fail-fast: false
            matrix:
                branch: ${{ fromJson(needs.determine-branches.outputs.branches) }}

        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ matrix.branch }}
                  # Full history + tags, so we can compare against the previous release.
                  fetch-depth: 0

            - name: Set up Python
              uses: actions/setup-python@v3
              with:
                  python-version: "3.13"

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -r requirements.txt

            - name: Determine base version from mkdocs.yml
              id: base_version
              run: |
                  key="latest_tag_$(echo '${{ matrix.branch }}' | tr '.' '_')"
                  base_version=$(python3 -c "import yaml; print(yaml.safe_load(open('mkdocs.yml'))['extra']['$key'])")
                  echo "base_version=${base_version}" >> "$GITHUB_OUTPUT"

            - name: Build documentation
              run: mkdocs build --strict

            - name: Sync generated Markdown into tracked directory
              run: |
                  rsync -a --delete --include='*/' --include='*.md' --exclude='*' site/ doc/
                  cp site/llms.txt llms.txt
                  cp site/llms-full.txt llms-full.txt

            - name: Check for content changes
              id: changes
              run: |
                  git add doc llms.txt llms-full.txt
                  if git diff --cached --quiet; then
                      echo "changed=false" >> "$GITHUB_OUTPUT"
                  else
                      echo "changed=true" >> "$GITHUB_OUTPUT"
                  fi

            - name: Commit generated Markdown
              if: steps.changes.outputs.changed == 'true'
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git commit -m "Update generated Markdown docs for ${{ steps.base_version.outputs.base_version }}"

            - name: Tag release
              if: steps.changes.outputs.changed == 'true'
              env:
                  BRANCH: ${{ matrix.branch }}
                  BASE_VERSION: ${{ steps.base_version.outputs.base_version }}
                  CHANGED: ${{ steps.changes.outputs.changed }}
              run: |
                  tag="${BASE_VERSION}.$(date -u +%Y%m%d)"

                  if git rev-parse "$tag" >/dev/null 2>&1; then
                      echo "Tag $tag already exists, skipping."
                      exit 0
                  fi

                  git tag "$tag"
                  if [[ "$CHANGED" == "true" ]]; then
                      git push origin "$BRANCH" "$tag"
                  else
                      git push origin "$tag"
                  fi
