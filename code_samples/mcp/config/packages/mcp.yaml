ibexa:
    repositories:
        default:
            mcp:
                example:
                    path: /mcp/example
                    enabled: true
                    description: 'Example MCP Server'
                    instructions: 'Use this server to greet someone.'
                    discovery_cache: cache.tagaware.filesystem
                    session:
                        type: file
                        directory: '%kernel.cache_dir%/mcp/sessions'
    system:
        default:
            mcp:
                servers:
                    - example
