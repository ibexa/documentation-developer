-
    type: content_type
    mode: create
    metadata:
        identifier: blog_post
        mainTranslation: eng-GB
        nameSchema: '<title>'
        urlAliasSchema: '<title>'
        container: true
        defaultAlwaysAvailable: true
        defaultSortField: 2 # Location::SORT_FIELD_PUBLISHED
        defaultSortOrder: 0 # Location::SORT_ORDER_DESC
        contentTypeGroups:
            - Content
        translations:
            eng-GB:
                name: Blog Post
    fields:
        -   identifier: title
            type: ibexa_string
            required: true
            translations:
                eng-GB:
                    name: 'Title'
        -   identifier: body
            type: ibexa_richtext
            required: false
            translations:
                eng-GB:
                    name: 'Body'
