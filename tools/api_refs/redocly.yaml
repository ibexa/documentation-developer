openapi:
  hideHostname: true
  theme:
    # Cohesivo palette. Without this block Redoc renders in its stock indigo.
    # Values mirror docs/css/tokens.css; primary is --cohesivo-primary-80.
    colors:
      primary:
        main: '#4E24A5'
      success:
        main: '#146D00'
      warning:
        main: '#A85000'
      error:
        main: '#BA2124'
      text:
        primary: '#0E1216'
    typography:
      fontFamily: "'Noto Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
      headings:
        fontFamily: "'Work Sans', 'Futura', 'Avenir Next', sans-serif"
      code:
        color: '#4E24A5'
    sidebar:
      activeTextColor: '#4E24A5'
    logo:
      maxWidth: '160px!important'
      maxHeight: '32px'
  downloadUrls:
    - title: Download as YAML
      url: 'https://raw.githubusercontent.com/ibexa/documentation-developer/saas/docs/api/rest_api/rest_api_reference/openapi.yaml'
    - title: Download as JSON
      url: 'https://raw.githubusercontent.com/ibexa/documentation-developer/saas/docs/api/rest_api/rest_api_reference/openapi.json'
plugins:
  - ./redocly-saas-plugin.js
# Applied by `redocly bundle` only, not by `redocly build-docs`: api_refs.sh bundles the schema before building the reference from it.
decorators:
  info-override:
    title: Cohesivo SaaS REST API
    # Empty so that the version isn't displayed next to the title.
    version: ''
    x-logo:
      url: 'https://doc.ibexa.co/en/saas/images/cohesivo-logo-alt.svg'
  # Groups not available on SaaS.
  filter-out:
    property: tags
    value: ['Corporate Account', 'Url Wildcard', 'User Token']
  saas/remove-badges: on
  saas/remove-unused-tags: on
  remove-unused-components: on
