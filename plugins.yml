plugins:
    - search
    - autolinks
    - macros:
        j2_block_start_string: '[[%'
        j2_block_end_string: '%]]'
        j2_variable_start_string: '[[='
        j2_variable_end_string: '=]]'
        j2_comment_start_string: '[[#'
        j2_comment_end_string: '#]]'
    - tags
    - llmstxt:
        preprocess: llmstxt_preprocess.py
        # The "> " prefix renders the description as a blockquote summary,
        # as expected by the llms.txt spec (https://llmstxt.org)
        markdown_description: >-
          > Developer documentation for Cohesivo — architecture, APIs, templating, and extensibility for building and customizing Ibexa DXP projects.

        # Pin links in the generated Markdown (and llms.txt) to this branch's
        # version instead of site_url's en/latest, without affecting the HTML
        # site's canonical URLs. Update when branching a new version.
        base_url: https://doc.ibexa.co/en/saas/
        autoclean: false
        full_output: llms-full.txt
        sections:
          # Built automatically when running MkDocs build based on MkDocs nav configuration, don't change
          Cohesivo developer documentation:
          - index.md
